# TurretX configuration. Units: cm, cm/s, seconds unless stated. See TURRETX_DESIGN.md §6.
camera:
  source: 1                 # webcam index (phone via Iriun is usually 1), video path, or URL
  width: 1920              # 1080p: vehicles and markers are small from ~2 m up
  height: 1080
# Arena (floor mat) size = distance between the CENTRES of the corner markers (TL→TR, TL→BL).
# Measure the real setup! (Called "table" in code; it can be any flat area.)
table_cm: [200, 150]
scale_m_per_cm: 10          # scenario scale (R9): 1 cm on the table = 10 m
aruco: {dict: DICT_4X4_50, ids: [0, 1, 2, 3]}   # TL, TR, BR, BL
camera_moved_px: 8
homography_file: homography.json
display: {max_width: 1600}   # window is scaled down to fit this width

detector:
  backend: yolo             # yolo | yoloworld | diff
  # One file or a list. A list runs every model and merges overlapping boxes into one vehicle:
  # stock yolov8n.pt finds the toy cars, models/vehicle.pt (trained on our makeshift vehicle) finds that one.
  weights: [yolov8n.pt, models/vehicle.pt]
  merge_iou: 0.3            # boxes overlapping this much (IoU) are the same vehicle
  merge_contain: 0.7        # ... or when the smaller box is this much inside the bigger one
  conf: [0.2, 0.5]          # one value, or one per weights file: low for stock toy cars, stricter for vehicle.pt
  imgsz: 960               # larger input helps small vehicles seen from high up
  exclude_classes: [person]
  classes_text: ["toy car"] # yoloworld only
  diff: {min_area: 400, max_area: 20000, thresh: 30, background: null}  # background: empty-table image path
  # Where in the box the car's position is: 0.5 = centre (camera near-overhead, >~75°),
  # 1.0 = bottom edge (shallow/angled camera). Confirm with scripts/measure_tag_offset.py (R11).
  ground_point_frac: 0.5
  world_weights: yolov8s-world.pt
tracker: {track_buffer: 60, velocity_window_s: 0.5}   # shorter = less lag on curves, more jitter

tags:                       # simulator-only GPS stand-in (R1)
  # mode disc: the round SIST2026 event sticker (dark disc in a light ring), found by shape.
  #   diameter_cm = diameter of the BLACK area inside the orange ring. Measure yours! One tag only.
  # mode hsv:  a single-colour patch instead, e.g. {mode: hsv, hsv_lo: [140,120,120], hsv_hi: [170,255,255]}
  # offset_cm: sticker-vs-track offset from scripts/measure_tag_offset.py (roof height + box bias)
  F-1: {mode: disc, diameter_cm: 4.5, offset_cm: [0.0, 0.0]}

turret:
  port: null                # e.g. COM5 (Device Manager → Ports); null = TURRET OFFLINE
  baud: 115200
  zone_margin_cm: 3
  interlock_recent_s: 5
  interlock_radius_cm: 10
  lead_ms: 150
  max_cmd_hz: 20
  min_move_deg: 0.5
  heartbeat_ms: 200

rf:
  key: "DEMO-KEY-turretx"   # demo only (R19)
  challenge_hz: 5
  latency_ms: 100
  pos_noise_cm: 3
  rssi: {p0: -40, n: 2.2, noise_db: 3, drone_alt_m: 300}
  udp:                      # REAL beacons over WiFi UDP (firmware/turretx_rover, turretx/udplink.py)
    enabled: false          # or run with --udp-beacon [ip,ip]
    ids: [F-1]              # answered by hardware: their simulated beacons are switched off
    targets: [auto]         # auto = learn rover IPs from their signed telemetry; or list the IPs
    challenge_port: 4210
    reply_port: 4211
    telemetry_port: 4212

matcher:
  sigma_pos_cm: 8
  gate_cm: 25
  sigma_speed: 5
  heading_min_speed: 5
  sigma_rssi_db: 6
  weights: {P: 0.45, M: 0.45, R: 0.10}
  ema_tau_s: 0.5            # time-based smoothing of confidence (frame-rate independent)
  friendly_threshold: 0.70
  mismatch_threshold: 0.30
  ambiguity_margin: 0.10
  ambiguity_floor: 0.40      # a runner-up below this can't make a match ambiguous
  enter_s: 1.0
  exit_s: 1.5
  claim_max_age_s: 0.6       # claims older than this are no longer "active"
  ghost_grace_s: 1.0         # a claim with no vehicle must persist this long to be a GHOST
  coast_max_s: 60            # track custody: max time a silent friendly keeps its identity
  custody_radius_cm: 15      # another vehicle this close breaks custody
  rf_denied_s: 2.0           # no valid claims for this long → RF DENIED

relay:               # simulated comms relay (RELAY_INTEGRATION.md); no RF is transmitted
  enabled: true
  nodes: [F-1, F-2]
  channels: 4
  hop_restores_iff: true   # false = keep the jam-first demo (RF DENIED stays after the hop)
  pos_every_s: 2.0         # RF-only mode: how often the drone broadcasts the blue-force picture
